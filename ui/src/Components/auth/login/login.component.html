<div class="signup-section">
  <br><br><br><br>
  <div class="row pt-4">
    <div class="col-md-4 offset-md-4 col-sm-6 offset-sm-3">
      <div class="card auth">
        <div class="card-body auth-card">
          <div class="auth-avatar">
            <img src="../../../assets/images/banner.jpg" alt="user" class="user-image">
          </div>
          <form (submit)="login(userData)">
            <div class="form-group pt-3 mt-3">
              <input type="text" name="email" class="form-control login-form" placeholder="Email"
                [(ngModel)]="userData.email">
            </div>
            <div class="form-group pt-2 mt-2">
              <input type="password" name="password" class="form-control login-form" placeholder="Password"
                [(ngModel)]="userData.password">
              <div class="text-right forget-pass mt-1">
                <a routerLink="/forget-password">Forget Password ?</a>
              </div>
            </div>
            <div class="text-center">
              <input type="submit" class="btn btn-my" value="Login">
            </div>
          </form>
          <div class="text-center sign-up">
            Don`t have an account ? <a routerLink="/registration">Sign Up</a> here.
          </div>
        </div>
      </div>
    </div>
  </div>
  <br><br><br><br><br><br><br><br>
</div>
